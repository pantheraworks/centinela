name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  firmware:
    name: ${{ matrix.firmware }} (${{ matrix.command }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        firmware: [centinela, torre]
        command: [build, clippy]
        include:
          - command: build
            args: --release
          - command: clippy
            args: -p centinela-esp --all-targets -- -D warnings
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build python3-venv
      - name: Setup Rust
        uses: esp-rs/xtensa-toolchain@v1.7
        with:
          default: true
          ldproxy: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.firmware }}
      - name: Run command
        run: ./scripts/${{ matrix.firmware }}.sh ${{ matrix.command }} ${{ matrix.args }}

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
      - name: Check formatting
        run: cargo +stable fmt --all -- --check --color always

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: host-tests
      - name: Lint core
        run: cargo +stable clippy -p centinela-core --all-targets --config 'unstable.build-std=[]' --target "$(rustc +stable -vV | awk '/^host:/{print $2}')" -- -D warnings
      - name: Run tests
        run: bash test.sh
      - name: Check core has no ESP dependencies
        run: bash scripts/check-core-deps.sh
